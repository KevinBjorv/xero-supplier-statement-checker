name: Feature request
description: Suggest an improvement to the read-only statement-checking workflow.
title: "[Feature] "
body:
  - type: textarea
    id: problem
    attributes:
      label: What operator problem would this solve?
      description: Describe the workflow with fictional examples. Keep customer data private.
    validations:
      required: true
  - type: textarea
    id: change
    attributes:
      label: Proposed behavior and alternatives
      description: The MVP excludes accounting writes, email sending, fuzzy matching, OCR and full payment reconciliation.
    validations:
      required: true
